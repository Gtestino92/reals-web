name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Web validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Preserve versioned legal URLs
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then exit 0; fi
          prior=$(git ls-tree --name-only "$BASE_SHA" -- dev-legal/SHA256SUMS)
          if [[ -n "$prior" ]]; then
            git show "$BASE_SHA:dev-legal/SHA256SUMS" > "$RUNNER_TEMP/prior-legal-manifest"
            node tools/verify-dev-legal.mjs --previous "$RUNNER_TEMP/prior-legal-manifest"
          fi
      - name: Check architecture
        run: npm run check:architecture
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --maxWorkers=2
      - name: Build dev and prod
        run: |
          VITE_REALS_ENVIRONMENT=dev npm run build
          (cd dist/legal && sha256sum -c ../../dev-legal/SHA256SUMS)
          VITE_REALS_ENVIRONMENT=prod npm run build
          test ! -e dist/legal
        env:
          # Existing Web hostname used only as an origin fixture. CI does not serve or deploy dist.
          VITE_API_BASE_URL: https://reals-web.pages.dev
          VITE_FIREBASE_API_KEY: synthetic-key
          VITE_FIREBASE_AUTH_DOMAIN: synthetic.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: synthetic
          VITE_FIREBASE_APP_ID: synthetic-app-id
          VITE_FIREBASE_APP_CHECK_PROVIDER: enterprise
          VITE_FIREBASE_APP_CHECK_SITE_KEY: synthetic-site-key
