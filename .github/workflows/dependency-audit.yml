name: Dependency audit

on:
  pull_request:
    branches: [development, main]
    paths:
      - package.json
      - package-lock.json
      - tools/dependency-audit*
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: '37 15 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies (${{ github.event_name == 'schedule' && 'development' || 'current' }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/development' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node tools/dependency-audit.mjs
